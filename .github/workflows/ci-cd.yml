name: Build and test

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Complete-Project-E2E.slnx

      - name: Build solution
        run: dotnet build Complete-Project-E2E.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Complete-Project-E2E.slnx --configuration Release --no-build
